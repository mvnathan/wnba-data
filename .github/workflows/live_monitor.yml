name: Live WNBA Game Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 12-23 * * 1-7'

concurrency:
  group: wnba-live-monitor
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Monitor live games
        run: |
          python scripts/monitor_live_games.py
      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state.json data/live_snapshots.parquet predictions/ docs/
          git diff --quiet --cached || git commit -m "Update live monitor state, snapshots, and dashboard"
          git push || true

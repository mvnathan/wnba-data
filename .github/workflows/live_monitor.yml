name: Live WNBA Game Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: wnba-live-monitor
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Poll live games and publish dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep a monitor alive long enough to bridge delayed GitHub cron starts.
          # A normally scheduled replacement starts every 5 minutes and cancels
          # this run. If GitHub delays the replacement, this job continues polling.
          # Thirty 45-second cycles provide about 22.5 minutes of coverage.
          for iteration in $(seq 1 30); do
            echo "Live poll ${iteration}/30"

            # Generated live-state files are also written by other workflows.
            # Always build from the newest main branch, and if another writer wins
            # the push race, discard this generated commit and rebuild on top of
            # that newer state instead of rebasing/merging generated files.
            published=false
            for publish_attempt in $(seq 1 5); do
              echo "Publish attempt ${publish_attempt}/5"

              git fetch origin main
              git reset --hard origin/main

              python scripts/monitor_live_games.py
              python scripts/build_opportunity_alerts.py
              python scripts/build_dashboard.py

              git add data/live_state.json data/live_snapshots.parquet data/alert_state.json predictions/ docs/

              if git diff --quiet --cached; then
                echo "No live-data changes to publish"
                published=true
                break
              fi

              git commit -m "Update live dashboard (${iteration}/30)"

              if git push origin HEAD:main; then
                published=true
                break
              fi

              echo "Main changed before push; rebuilding from latest main"
              if [ "${publish_attempt}" -lt 5 ]; then
                sleep 2
              fi
            done

            if [ "${published}" != true ]; then
              echo "Failed to publish live dashboard after 5 attempts" >&2
              exit 1
            fi

            if [ "${iteration}" -lt 30 ]; then
              sleep 45
            fi
          done

name: Live WNBA Game Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: wnba-live-monitor
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Poll live games and publish dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # GitHub scheduled starts can be delayed well beyond the nominal 5-minute
          # cadence. Keep the current monitor alive for roughly five hours so live
          # projections do not go stale while waiting for a replacement run. A
          # normally scheduled replacement still cancels this run and takes over.
          max_polls=400
          for iteration in $(seq 1 "${max_polls}"); do
            echo "Live poll ${iteration}/${max_polls}"

            # Generated live-state files are also written by other workflows.
            # Always build from the newest main branch, and if another writer wins
            # the push race, discard this generated commit and rebuild on top of
            # that newer state instead of rebasing/merging generated files.
            published=false
            for publish_attempt in $(seq 1 5); do
              echo "Publish attempt ${publish_attempt}/5"

              git fetch origin main
              git reset --hard origin/main

              python scripts/monitor_live_games.py
              python scripts/build_opportunity_alerts.py
              python scripts/build_dashboard.py

              git add data/live_state.json data/live_snapshots.parquet data/alert_state.json predictions/ docs/

              if git diff --quiet --cached; then
                echo "No live-data changes to publish"
                published=true
                break
              fi

              git commit -m "Update live dashboard (${iteration}/${max_polls})"

              if git push origin HEAD:main; then
                published=true
                break
              fi

              echo "Main changed before push; rebuilding from latest main"
              if [ "${publish_attempt}" -lt 5 ]; then
                sleep 2
              fi
            done

            if [ "${published}" != true ]; then
              echo "Failed to publish live dashboard after 5 attempts" >&2
              exit 1
            fi

            if [ "${iteration}" -lt "${max_polls}" ]; then
              sleep 45
            fi
          done

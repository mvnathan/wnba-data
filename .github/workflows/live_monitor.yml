name: Live WNBA Game Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live_monitor.yml'
      - 'scripts/monitor_live_games.py'
      - 'scripts/enrich_quarter_projection.py'
      - 'src/live_monitor.py'
      - 'src/live_predict.py'
      - 'src/quarter_detector.py'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: wnba-live-monitor
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether live monitoring is needed
        id: schedule_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          chicago = now.astimezone(ZoneInfo('America/Chicago'))
          dates = [(chicago.date() - timedelta(days=1)).strftime('%Y%m%d'), chicago.strftime('%Y%m%d')]
          should_run = False

          try:
              for date_text in dates:
                  url = f'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard?dates={date_text}'
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  for event in payload.get('events', []):
                      competition = (event.get('competitions') or [{}])[0]
                      state = competition.get('status', {}).get('type', {}).get('state')
                      start_text = event.get('date') or competition.get('date')
                      start = datetime.fromisoformat(start_text.replace('Z', '+00:00')) if start_text else None
                      if state == 'in':
                          should_run = True
                      elif state == 'pre' and start and -timedelta(hours=1) <= start - now <= timedelta(hours=1):
                          should_run = True
                      elif state == 'post' and start and now - start <= timedelta(hours=5):
                          should_run = True
          except Exception as exc:
              # A schedule-check outage must never prevent live coverage.
              print(f'Schedule check failed; running monitor as a safeguard: {exc}')
              should_run = True

          print(f'Live monitoring needed: {should_run}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'should_run={str(should_run).lower()}\n')
          PY
      - name: Set up Python
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh live snapshot and dashboard once
        if: steps.schedule_check.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          python scripts/monitor_live_games.py
          python scripts/enrich_quarter_projection.py

          if ! python scripts/refresh_market_odds.py; then
            echo "Warning: market odds refresh failed; keeping prior quote" >&2
          fi

          rm -f predictions/referee_experiment_error.txt
          if python scripts/referee_experiment.py > /tmp/referee_experiment.log 2>&1; then
            echo "Referee experiment completed"
            rm -f predictions/referee_experiment_error.txt
          else
            echo "Warning: referee experiment failed; production forecast unchanged" >&2
            cat /tmp/referee_experiment.log >&2
            cp /tmp/referee_experiment.log predictions/referee_experiment_error.txt
          fi

          python scripts/build_opportunity_alerts.py
          python scripts/build_dashboard.py
          git add data/live_state.json data/live_snapshots.parquet data/alert_state.json predictions/ docs/

          if git diff --quiet --cached; then
            echo "No live-data changes to publish"
            exit 0
          fi

          git commit -m "Update live dashboard snapshot"
          git push origin HEAD:main

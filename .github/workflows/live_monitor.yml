name: Live WNBA Game Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live_monitor.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: wnba-live-monitor
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Poll live games and publish dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          max_polls=400
          for iteration in $(seq 1 "${max_polls}"); do
            echo "Live poll ${iteration}/${max_polls}"
            published=false
            for publish_attempt in $(seq 1 5); do
              echo "Publish attempt ${publish_attempt}/5"
              git fetch origin main
              git reset --hard origin/main

              python scripts/monitor_live_games.py
              python scripts/enrich_quarter_projection.py

              if [ "${iteration}" -eq 1 ] || [ $((iteration % 6)) -eq 0 ]; then
                if ! python scripts/refresh_market_odds.py; then
                  echo "Warning: market odds refresh failed; keeping prior quote" >&2
                fi
              fi

              if [ "${iteration}" -eq 1 ]; then
                rm -f predictions/referee_experiment_error.txt
                if python scripts/referee_experiment.py > /tmp/referee_experiment.log 2>&1; then
                  echo "Referee experiment completed"
                  rm -f predictions/referee_experiment_error.txt
                else
                  echo "Warning: referee experiment failed; production forecast unchanged" >&2
                  cat /tmp/referee_experiment.log >&2
                  cp /tmp/referee_experiment.log predictions/referee_experiment_error.txt
                fi
              fi

              python scripts/build_opportunity_alerts.py
              python scripts/build_dashboard.py
              git add data/live_state.json data/live_snapshots.parquet data/alert_state.json predictions/ docs/

              if git diff --quiet --cached; then
                echo "No live-data changes to publish"
                published=true
                break
              fi
              git commit -m "Update live dashboard (${iteration}/${max_polls})"
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "Main changed before push; rebuilding from latest main"
              if [ "${publish_attempt}" -lt 5 ]; then sleep 2; fi
            done
            if [ "${published}" != true ]; then
              echo "Failed to publish live dashboard after 5 attempts" >&2
              exit 1
            fi
            if [ "${iteration}" -lt "${max_polls}" ]; then sleep 45; fi
          done

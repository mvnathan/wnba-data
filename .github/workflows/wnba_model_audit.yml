name: WNBA Model Audit

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/audit_wnba_model.py'
      - 'docs/performance.json'
      - '.github/workflows/wnba_model_audit.yml'

permissions:
  contents: write

concurrency:
  group: wnba-model-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build audit
        run: python scripts/audit_wnba_model.py
      - name: Publish audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wnba-model-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update WNBA model audit"
          git push

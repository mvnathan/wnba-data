name: Generate MLB Production Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12,17,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_mlb_v2.py'

concurrency:
  group: sportsmodelhub-mlb-v2
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests curl_cffi pandas
      - name: Generate MLB v2 production
        run: python scripts/generate_mlb_v2.py
      - name: Validate production
        run: |
          python - <<'PY'
          import json
          d=json.load(open("predictions/mlb-v2-latest.json"))
          assert d["model_status"]=="production"
          for g in d["games"]:
              assert g["predicted_winner"]
              assert 0 <= g["home_win_probability"] <= 1
              assert g["predicted_home_runs"] > 0 and g["predicted_away_runs"] > 0
          print("Validated",len(d["games"]),"MLB v2 candidate games")
          PY
      - name: Publish production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              python scripts/generate_mlb_v2.py
            fi
            git add predictions/mlb-v2-latest.json docs/mlb-v2-latest.json predictions/mlb-latest.json docs/mlb-latest.json
            if git diff --quiet --cached; then published=true; break; fi
            git commit -m "Update production MLB v2 predictions"
            if git push origin HEAD:main; then published=true; break; fi
            sleep 2
          done
          [ "$published" = true ]

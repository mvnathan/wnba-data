name: Independent Model Dashboard Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard_model_migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/update_dashboard_independent_model.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clarify independent model and market edge dashboard"
          git pull --rebase origin main
          git push origin HEAD:main

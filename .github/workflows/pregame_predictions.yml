name: Generate WNBA Pregame Predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pregame_predictions.yml'
      - 'src/predict_pregame.py'
  schedule:
    - cron: '12 14,18,22 * * *'

# Manual repaired consensus refresh trigger: 2026-08-30T22:16Z

concurrency:
  group: wnba-pregame-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh travel possession and rotation features
        run: python scripts/enrich_pregame_features.py
      - name: Build features
        run: python scripts/build_features.py
      - name: Generate predictions
        run: python scripts/predict_today.py
      - name: Evaluate opportunity alerts
        run: python scripts/build_opportunity_alerts.py
      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py
          python scripts/update_dashboard_independent_model.py || true
          python scripts/update_dashboard_decision_first.py || true
      - name: Verify prediction output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('predictions/latest.json')
          if not path.exists(): raise SystemExit('predictions/latest.json was not created')
          data = json.loads(path.read_text())
          games = data.get('games', [])
          print('Target date:', data.get('target_date')); print('Games:', len(games))
          if not data.get('target_date'): raise SystemExit('target_date is missing from predictions/latest.json')
          if not isinstance(games, list): raise SystemExit('games must be a list in predictions/latest.json')
          if not games:
              print('No eligible games today; empty prediction output is valid')
          missing_required=[]
          missing_market=[]
          for g in games:
              print(g.get('away_abbr'),'@',g.get('home_abbr'),'| version:',g.get('market_blend_version'),'| book:',g.get('market_bookmaker'),'| books:',g.get('market_book_count'),'| consensus spread:',g.get('consensus_home_spread'),'| consensus total:',g.get('consensus_total'))
              for field in ('home_win_probability','predicted_margin','predicted_total','home_score','away_score'):
                  if g.get(field) is None: missing_required.append((g.get('game_id'),field))
              for field in ('market_book_count','consensus_home_spread','consensus_total'):
                  if g.get(field) is None: missing_market.append((g.get('game_id'),field))
          if missing_required: raise SystemExit(f'Required independent-model fields missing: {missing_required}')
          if missing_market: print(f'Warning: market comparison fields unavailable; publishing independent-model predictions: {missing_market}')
          PY
      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          published=false
          for publish_attempt in $(seq 1 5); do
            echo "Publish attempt ${publish_attempt}/5"
            if [ "${publish_attempt}" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              python scripts/enrich_pregame_features.py
              python scripts/build_features.py
              python scripts/predict_today.py
              python scripts/build_opportunity_alerts.py
              python scripts/build_dashboard.py
              python scripts/update_dashboard_independent_model.py || true
              python scripts/update_dashboard_decision_first.py || true
            fi
            git add predictions/ docs/ data/alert_state.json data/games.parquet
            if git diff --quiet --cached; then echo "No pregame output changes to publish"; published=true; break; fi
            git commit -m "Update pregame predictions and dashboard"
            if git push origin HEAD:main; then published=true; break; fi
            if [ "${publish_attempt}" -lt 5 ]; then sleep 2; fi
          done
          if [ "${published}" != true ]; then exit 1; fi

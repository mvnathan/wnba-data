name: Generate WNBA Pregame Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '12 14 * * *'

concurrency:
  group: wnba-pregame-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PYTHONPATH: ${{ github.workspace }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build features
        run: |
          python scripts/build_features.py

      - name: Generate predictions
        run: |
          python scripts/predict_today.py

      - name: Evaluate opportunity alerts
        run: |
          python scripts/build_opportunity_alerts.py

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py

      - name: Verify prediction output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("predictions/latest.json")

          if not path.exists():
              raise SystemExit(
                  "predictions/latest.json was not created"
              )

          with path.open() as f:
              data = json.load(f)

          games = data.get("games", [])

          print("Target date:", data.get("target_date"))
          print("Games:", len(games))

          for game in games:
              print(
                  game.get("away_abbr"),
                  "@",
                  game.get("home_abbr"),
                  "| margin:",
                  game.get("predicted_margin"),
                  "| winner:",
                  game.get("projected_winner_abbr"),
                  "| coherent:",
                  game.get("prediction_coherent"),
                  "| book:",
                  game.get("market_bookmaker"),
              )
          PY

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add predictions/ docs/ data/alert_state.json

          git diff --quiet --cached || \
            git commit -m "Update pregame predictions and dashboard"

          git push

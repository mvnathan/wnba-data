name: Advanced WNBA Model Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/advanced_model_research.yml'
      - 'scripts/backfill_advanced_data.py'
      - 'scripts/enrich_pregame_features.py'
      - 'scripts/build_features.py'
      - 'scripts/run_feature_ablation.py'
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: write

concurrency:
  group: wnba-advanced-model-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Backfill team and player box-score data
        run: |
          python scripts/backfill_advanced_data.py

      - name: Build advanced pregame features
        run: |
          python scripts/enrich_pregame_features.py
          python scripts/build_features.py

      - name: Run walk-forward feature ablation
        run: |
          python scripts/run_feature_ablation.py

      - name: Summarize research result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('models/feature_ablation.json').read_text())
          print('Feature sets:', result.get('feature_sets'))
          print('Best by target:')
          for target, row in result.get('best_by_target', {}).items():
              print(target, row)
          PY

      - name: Commit research artifacts and enriched data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for publish_attempt in $(seq 1 3); do
            echo "Publish attempt ${publish_attempt}/3"

            if [ "${publish_attempt}" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main

              # Rebuild on the newest generated state. This avoids rebasing
              # binary parquet files while live-monitor commits are landing.
              python scripts/backfill_advanced_data.py
              python scripts/enrich_pregame_features.py
              python scripts/build_features.py
              python scripts/run_feature_ablation.py
            fi

            git add -f data/team_box_stats.parquet data/player_box_stats.parquet data/games.parquet features/model_features.parquet
            git add models/feature_ablation.json models/feature_ablation.csv models/advanced_data_status.json models/advanced_feature_status.json

            if git diff --cached --quiet; then
              echo "No research changes to publish"
              published=true
              break
            fi

            git commit -m "Update advanced model research"

            # Generated files outside the publish list may also change. Drop
            # those unstaged copies so they cannot block the next retry.
            git reset --hard HEAD

            if git push origin HEAD:main; then
              published=true
              break
            fi
          done

          if [ "${published}" != true ]; then
            echo "Failed to publish advanced research after 3 attempts" >&2
            exit 1
          fi

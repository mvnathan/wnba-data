name: Sharp Signal Shadow

on:
  workflow_dispatch: {}
  schedule:
    - cron: '27 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_sharp_signal.py'
      - 'config/sharp_signal_accounts.json'
      - '.github/workflows/sharp_signal_shadow.yml'

permissions:
  contents: write

concurrency:
  group: sharp-signal-shadow
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Collect sharp signals
        run: python scripts/generate_sharp_signal.py
      - name: Validate shadow-only policy
        run: |
          python - <<'PY'
          import json
          d=json.load(open("docs/sharp-signal-latest.json"))
          assert d.get("production_adjustment_enabled") is False
          print("sharp signal status",d.get("status"))
          print("new picks",d.get("new_picks_parsed"))
          print("ledger size",d.get("ledger_size"))
          PY
      - name: Publish shadow ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs
          cp data/sharp-signal-state.json /tmp/sharp-state.json
          cp data/sharp-picks-ledger.json /tmp/sharp-ledger.json
          cp docs/sharp-signal-latest.json /tmp/sharp-docs.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sharp-state.json data/sharp-signal-state.json
            cp /tmp/sharp-ledger.json data/sharp-picks-ledger.json
            cp /tmp/sharp-docs.json docs/sharp-signal-latest.json
            git add data/sharp-signal-state.json data/sharp-picks-ledger.json docs/sharp-signal-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update sharp signal shadow ledger"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

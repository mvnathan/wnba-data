name: Backfill WNBA Data

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated seasons to backfill"
        required: true
        default: "2024 2025 2026"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Backfill seasons
  run: |
    python scripts/run_backfill.py \
      --seasons ${{ github.event.inputs.seasons }} \
      --force
      
      - name: Show generated data
        run: |
          echo "Files generated by backfill:"
          find data -maxdepth 2 -type f -print
          echo ""
          echo "Git status:"
          git status --short

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update WNBA historical data"
            git push
          fi

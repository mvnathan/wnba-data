name: Deploy Live Dashboard Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy_live_worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Test Worker
        working-directory: worker
        run: |
          npm run check
          npm test
      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Sync Sportradar API key
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          test -n "$SPORTRADAR_API_KEY"
          printf '%s' "$SPORTRADAR_API_KEY" | npx wrangler secret put SPORTRADAR_API_KEY
      - name: Verify deployed Worker endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://wnba-live-dashboard.mvnathan.workers.dev"

          echo "Waiting briefly for the new Worker version to propagate..."
          sleep 5

          echo "Checking health endpoint"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${BASE_URL}/health?t=$(date +%s)" \
            | tee /tmp/worker-health.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/worker-health.json').read_text())
          if data.get('ok') is not True:
              raise SystemExit(f'Worker health check failed: {data}')
          if data.get('snapshot_source') == 'github-pages-pregame':
              raise SystemExit(f'Worker is still serving the legacy Pages-backed snapshot: {data}')
          if not data.get('target_date'):
              raise SystemExit(f'Worker health response is missing target_date: {data}')
          print('Health OK:', data)
          PY

          echo "Checking diagnostics endpoint"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${BASE_URL}/diagnostics?t=$(date +%s)" \
            | tee /tmp/worker-diagnostics.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/worker-diagnostics.json').read_text())
          if data.get('service') != 'wnba-live-dashboard':
              raise SystemExit(f'Unexpected diagnostics response: {data}')
          if data.get('static_latest', {}).get('ok') is not True:
              raise SystemExit(f'Worker cannot read the canonical snapshot: {data}')
          if data.get('sportradar', {}).get('ok') is not True:
              raise SystemExit(f'Worker cannot reach primary Sportradar data: {data}')
          print('Diagnostics service OK')
          print('Sportradar:', data.get('sportradar'))
          print('Static latest:', data.get('static_latest'))
          PY

          echo "Checking live snapshot endpoint"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${BASE_URL}/latest.json?t=$(date +%s)" \
            | tee /tmp/worker-latest.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/worker-latest.json').read_text())
          games = data.get('games')
          if not isinstance(games, list):
              raise SystemExit(f'latest.json missing games list: {data}')
          if not str(data.get('live_delivery', '')).startswith('cloudflare'):
              raise SystemExit(f'latest.json is not Cloudflare-managed: {data}')
          if data.get('cloudflare_snapshot_stale') is not False:
              raise SystemExit(f'Cloudflare snapshot is stale: {data}')
          if not data.get('target_date'):
              raise SystemExit(f'latest.json missing target_date: {data}')
          print('Latest snapshot OK')
          print('Games:', len(games))
          print('Target date:', data.get('target_date'))
          print('Live delivery:', data.get('live_delivery'))
          print('Live source:', data.get('live_source'))
          print('Snapshot generated:', data.get('live_generated_at_utc'))
          PY

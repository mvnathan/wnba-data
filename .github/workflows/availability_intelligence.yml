name: Availability Intelligence

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_availability_intelligence.py'
      - 'src/availability_intelligence.py'
      - 'config/availability_sources.json'
      - '.github/workflows/availability_intelligence.yml'

permissions:
  contents: write

concurrency:
  group: availability-intelligence
  cancel-in-progress: true

jobs:
  availability:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas
      - name: Build availability intelligence
        run: python scripts/generate_availability_intelligence.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d=json.load(open("docs/availability-latest.json"))
          assert d["status"]=="ok"
          assert d["direct_model_adjustment_enabled"] is False
          print("availability signals",len(d.get("signals") or []))
          print("x",d.get("x_source_diagnostics"))
          PY
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/availability-latest.json /tmp/availability-docs.json
          cp data/availability-latest.json /tmp/availability-data.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/availability-docs.json docs/availability-latest.json
            cp /tmp/availability-data.json data/availability-latest.json
            git add docs/availability-latest.json data/availability-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update availability intelligence"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

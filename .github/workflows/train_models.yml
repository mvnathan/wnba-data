name: Train WNBA Prediction Models

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          PYTHONPATH=. python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily update
        run: |
          PYTHONPATH=. python scripts/run_daily_update.py
      - name: Build features
        run: |
          python scripts/build_features.py
      - name: Train models
        run: |
          PYTHONPATH=. python scripts/train_models.py
      - name: Commit model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ features/ .
          git diff --quiet --cached || git commit -m "Update production model and features"
          git push || true

name: Analyze WNBA Feature Sets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/feature_ablation.py'
      - 'scripts/run_feature_ablation.py'
      - '.github/workflows/feature_ablation.yml'

concurrency:
  group: wnba-feature-ablation
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run walk-forward feature ablation
        run: python scripts/run_feature_ablation.py
      - name: Commit analysis outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/feature_ablation.json models/feature_ablation.csv
          if git diff --quiet --cached; then
            echo "No ablation output changes"
            exit 0
          fi
          git commit -m "Update feature ablation results"
          git pull --rebase origin main
          git push origin HEAD:main

name: Generate MLB Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '15 13,17,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb_predictions.yml'
      - 'scripts/generate_mlb_predictions.py'
      - 'src/draftkings_direct.py'
      - 'docs/mlb.html'

concurrency:
  group: sportsmodelhub-mlb-predictions
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests curl_cffi
      - name: Generate MLB winner and score predictions
        run: python scripts/generate_mlb_predictions.py
      - name: Validate MLB output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("predictions/mlb-latest.json")
          d=json.loads(p.read_text())
          assert d.get("sport")=="MLB"
          assert isinstance(d.get("games"),list)
          for g in d["games"]:
              for key in ("predicted_winner","home_win_probability","predicted_home_runs","predicted_away_runs"):
                  assert g.get(key) is not None, (g.get("game_id"),key)
          print("Validated",len(d["games"]),"MLB games for",d.get("target_date"))
          PY
      - name: Publish MLB predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/mlb-latest.json docs/mlb-latest.json
          if git diff --quiet --cached; then exit 0; fi
          git commit -m "Update MLB predictions"
          git pull --rebase origin main
          git push origin HEAD:main

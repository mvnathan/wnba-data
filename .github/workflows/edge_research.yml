name: Market Edge Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge_research.yml'
      - 'scripts/analyze_market_edges.py'
      - 'scripts/update_dashboard_decision_first.py'
      - 'predictions/performance_history.parquet'
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: wnba-edge-research
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Analyze model disagreement with market
        run: python scripts/analyze_market_edges.py
      - name: Update decision-first dashboard
        run: python scripts/update_dashboard_decision_first.py
      - name: Publish edge performance and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/edge_performance.json docs/index.html
          if git diff --cached --quiet; then
            echo "No edge-performance or dashboard changes"
            exit 0
          fi
          git commit -m "Update market edge performance and dashboard"
          git pull --rebase origin main
          git push origin HEAD:main

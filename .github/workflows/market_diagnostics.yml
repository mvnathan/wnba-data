name: WNBA Market Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market_diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install requests
      - name: Capture sanitized market diagnostics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from src.market_odds import fetch_draftkings_wnba_odds

          out = {"generated_at_utc": datetime.now(timezone.utc).isoformat(), "status": "ok", "events": []}
          try:
              rows = fetch_draftkings_wnba_odds()
              for game in rows:
                  out["events"].append({
                      "id": game.get("id"),
                      "commence_time": game.get("commence_time"),
                      "home_team": game.get("home_team"),
                      "away_team": game.get("away_team"),
                      "bookmakers": [
                          {
                              "key": b.get("key"),
                              "title": b.get("title"),
                              "last_update": b.get("last_update"),
                              "markets": [m.get("key") for m in b.get("markets", [])],
                          }
                          for b in game.get("bookmakers", [])
                      ],
                  })
              out["event_count"] = len(rows)
          except Exception as exc:
              out["status"] = "error"
              out["error_type"] = type(exc).__name__
              out["error"] = str(exc).replace(str(__import__('os').environ.get('ODDS_API_KEY') or ''), '[REDACTED]')
          path = Path('data/market_diagnostic.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
      - name: Publish diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_diagnostic.json
          if git diff --quiet --cached; then exit 0; fi
          git commit -m "Update market diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main

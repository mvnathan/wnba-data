name = "wnba-live-dashboard"
main = "src/stateful_index.js"
compatibility_date = "2026-08-15"
workers_dev = true

[triggers]
crons = ["*/1 * * * *"]

[[durable_objects.bindings]]
name = "LIVE_SNAPSHOT"
class_name = "LiveSnapshotStore"

[[migrations]]
tag = "v1-live-snapshot"
new_sqlite_classes = ["LiveSnapshotStore"]

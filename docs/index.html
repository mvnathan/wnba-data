<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    WNBA Prediction Dashboard
  </title>

  <style>

    :root {
      --bg: #090c11;
      --panel: #151a22;
      --panel-soft: #10151c;
      --panel-raised: #1a2029;

      --border: #29313d;
      --border-soft: #202833;

      --text: #f4f7fb;
      --muted: #929cab;

      --accent: #7aa2ff;
      --green: #63d297;
      --red: #ff8585;
      --yellow: #f4cd66;

      --live: #ff5a5f;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }


    header {
      border-bottom:
        1px solid var(--border);

      background:
        rgba(
          9,
          12,
          17,
          0.96
        );

      position: sticky;
      top: 0;
      z-index: 10;
    }


    .header-inner {
      max-width: 1240px;

      margin: 0 auto;

      padding:
        24px 24px;
    }


    .header-title {
      margin:
        0 0 5px;

      font-size: 1.9rem;
      font-weight: 800;
    }


    .muted {
      color: var(--muted);
    }


    main {
      max-width: 1240px;

      margin: 0 auto;

      padding:
        24px;
    }


    .dashboard-status {
      margin-bottom: 22px;

      padding:
        15px 19px;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-radius:
        14px;
    }


    .game-card {
      margin-bottom: 24px;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-radius:
        18px;

      overflow: hidden;
    }


    .game-card.live-game {
      border-color:
        rgba(
          255,
          90,
          95,
          0.65
        );
    }


    .game-header {
      padding:
        20px 24px;

      border-bottom:
        1px solid var(--border);
    }


    .status {
      display: inline-block;

      margin-bottom:
        12px;

      padding:
        5px 10px;

      border-radius:
        999px;

      background:
        #29313d;

      color:
        #dce3ed;

      font-size:
        0.76rem;

      font-weight:
        750;

      letter-spacing:
        0.04em;

      text-transform:
        uppercase;
    }


    .status.live {
      background:
        rgba(
          255,
          90,
          95,
          0.17
        );

      color:
        #ff8c8f;

      border:
        1px solid
        rgba(
          255,
          90,
          95,
          0.5
        );
    }


    .status.final {
      background:
        rgba(
          99,
          210,
          151,
          0.13
        );

      color:
        var(--green);
    }


    .matchup-row {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 18px;
    }


    .matchup-teams {
      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;
    }


    .team-block {
      display: flex;

      align-items: center;

      gap: 9px;
    }


    .team-logo {
      width: 42px;
      height: 42px;

      object-fit: contain;

      flex: 0 0 auto;
    }


    .team-fallback {
      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        #252d38;

      color:
        var(--text);

      font-size:
        0.72rem;

      font-weight:
        800;
    }


    .matchup-name {
      font-size:
        1.5rem;

      font-weight:
        800;
    }


    .at-symbol {
      color:
        var(--muted);

      font-size:
        1.1rem;

      font-weight:
        700;
    }


    .venue {
      margin-top:
        7px;

      color:
        var(--muted);

      font-size:
        0.88rem;
    }


    .game-body {
      padding:
        22px 24px 26px;
    }


    .live-score-panel {
      margin-bottom:
        22px;

      padding:
        18px;

      border:
        1px solid
        rgba(
          255,
          90,
          95,
          0.35
        );

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            90,
            95,
            0.10
          ),
          rgba(
            16,
            21,
            28,
            1
          )
        );

      border-radius:
        14px;
    }


    .live-score-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 12px;

      margin-bottom:
        14px;
    }


    .live-label {
      color:
        #ff8c8f;

      font-size:
        0.8rem;

      font-weight:
        850;

      text-transform:
        uppercase;

      letter-spacing:
        0.06em;
    }


    .live-clock {
      color:
        var(--muted);

      font-size:
        0.9rem;

      font-weight:
        700;
    }


    .live-score-grid {
      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items:
        center;

      gap: 16px;
    }


    .live-team {
      text-align:
        center;
    }


    .live-team-abbr {
      color:
        var(--muted);

      margin-bottom:
        3px;

      font-size:
        0.78rem;

      font-weight:
        800;
    }


    .live-team-score {
      font-size:
        2.4rem;

      font-weight:
        900;
    }


    .live-score-divider {
      color:
        var(--muted);

      font-size:
        1.2rem;

      font-weight:
        700;
    }


    .pregame-heading {
      margin:
        22px 0 12px;

      color:
        #d8dee8;

      font-size:
        0.85rem;

      font-weight:
        800;

      letter-spacing:
        0.05em;

      text-transform:
        uppercase;
    }


    .headline-grid {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin-bottom:
        16px;
    }


    .metric {
      min-width: 0;

      padding:
        14px;

      background:
        var(--panel-soft);

      border:
        1px solid
        var(--border-soft);

      border-radius:
        12px;
    }


    .metric-label {
      margin-bottom:
        7px;

      color:
        var(--muted);

      font-size:
        0.8rem;
    }


    .metric-value {
      font-size:
        1.45rem;

      font-weight:
        800;

      line-height:
        1.1;
    }


    .metric-value.pick {
      color:
        var(--green);
    }


    .score-grid {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 8px;
    }


    .score-side {
      flex: 1;

      text-align:
        center;
    }


    .score-abbr {
      margin-bottom:
        3px;

      color:
        var(--muted);

      font-size:
        0.72rem;

      font-weight:
        800;
    }


    .score-number {
      font-size:
        1.7rem;

      font-weight:
        850;
    }


    .score-separator {
      color:
        var(--muted);

      font-weight:
        700;
    }


    .section-title {
      margin:
        26px 0 12px;

      font-size:
        1rem;
    }


    .market-section {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;
    }


    .market-panel {
      padding:
        16px;

      background:
        var(--panel-soft);

      border:
        1px solid
        var(--border-soft);

      border-radius:
        13px;
    }


    .market-panel-title {
      margin-bottom:
        13px;

      color:
        var(--muted);

      font-size:
        0.82rem;

      font-weight:
        800;

      text-transform:
        uppercase;

      letter-spacing:
        0.04em;
    }


    .market-line {
      display: flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 12px;

      padding:
        8px 0;

      border-bottom:
        1px solid
        var(--border-soft);
    }


    .market-line:last-child {
      border-bottom:
        none;
    }


    .market-label {
      color:
        var(--muted);

      font-size:
        0.84rem;
    }


    .market-value {
      text-align:
        right;

      font-weight:
        800;
    }


    .edge-positive {
      color:
        var(--green);
    }


    .edge-negative {
      color:
        var(--red);
    }


    .edge-neutral {
      color:
        var(--yellow);
    }


    .market-placeholder {
      color:
        var(--muted);

      font-size:
        0.88rem;

      line-height:
        1.5;
    }


    .projection-table-wrap,
    .history-table-wrap {
      overflow-x:
        auto;
    }


    .projection-table {
      width:
        100%;

      border-collapse:
        separate;

      border-spacing:
        0;

      background:
        var(--panel-soft);

      border:
        1px solid
        var(--border-soft);

      border-radius:
        12px;

      overflow:
        hidden;
    }


    .projection-table th,
    .projection-table td {
      padding:
        10px 13px;

      text-align:
        right;

      border-bottom:
        1px solid
        var(--border-soft);
    }


    .projection-table th:first-child,
    .projection-table td:first-child {
      text-align:
        left;
    }


    .projection-table th {
      color:
        var(--muted);

      font-size:
        0.76rem;

      font-weight:
        700;
    }


    .projection-table td {
      font-size:
        0.9rem;

      font-weight:
        650;
    }


    .projection-table tr:last-child td {
      border-bottom:
        0;
    }


    .history-card {
      margin-top:
        30px;

      padding:
        20px;

      background:
        var(--panel);

      border:
        1px solid
        var(--border);

      border-radius:
        18px;
    }


    .history-card h2 {
      margin-top:
        0;
    }


    .history-table {
      width:
        100%;

      border-collapse:
        collapse;
    }


    .history-table th,
    .history-table td {
      padding:
        10px;

      text-align:
        left;

      border-bottom:
        1px solid
        var(--border);
    }


    .history-table th {
      color:
        var(--muted);

      font-size:
        0.78rem;
    }


    @media (
      max-width:
      950px
    ) {

      .headline-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .market-section {
        grid-template-columns:
          1fr;
      }

    }


    @media (
      max-width:
      620px
    ) {

      main,
      .header-inner {
        padding-left:
          14px;

        padding-right:
          14px;
      }


      .headline-grid {
        grid-template-columns:
          1fr;
      }


      .matchup-row {
        display:
          block;
      }


      .matchup-teams {
        flex-wrap:
          wrap;
      }


      .matchup-name {
        font-size:
          1.2rem;
      }


      .team-logo {
        width:
          34px;

        height:
          34px;
      }


      .live-team-score {
        font-size:
          2rem;
      }


      .projection-table {
        font-size:
          0.8rem;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="header-inner">

    <h1 class="header-title">
      WNBA Prediction Dashboard
    </h1>

    <div class="muted">
      Pregame projections, DraftKings market comparison, and live game tracking
    </div>

  </div>

</header>


<main>


  <div
    id="status"
    class="dashboard-status"
  >
    Loading prediction data...
  </div>


  <div id="games"></div>


  <section class="history-card">

    <h2>
      Prediction History
    </h2>

    <div id="history">
      Loading...
    </div>

  </section>


</main>


<script>


  const TEAM_LOGOS = {

    ATL:
      "https://a.espncdn.com/i/teamlogos/wnba/500/atl.png",

    CHI:
      "https://a.espncdn.com/i/teamlogos/wnba/500/chi.png",

    CON:
      "https://a.espncdn.com/i/teamlogos/wnba/500/conn.png",

    DAL:
      "https://a.espncdn.com/i/teamlogos/wnba/500/dal.png",

    GS:
      "https://a.espncdn.com/i/teamlogos/wnba/500/gs.png",

    IND:
      "https://a.espncdn.com/i/teamlogos/wnba/500/ind.png",

    LA:
      "https://a.espncdn.com/i/teamlogos/wnba/500/la.png",

    LV:
      "https://a.espncdn.com/i/teamlogos/wnba/500/lv.png",

    MIN:
      "https://a.espncdn.com/i/teamlogos/wnba/500/min.png",

    NY:
      "https://a.espncdn.com/i/teamlogos/wnba/500/ny.png",

    PHX:
      "https://a.espncdn.com/i/teamlogos/wnba/500/phx.png",

    POR:
      "https://a.espncdn.com/i/teamlogos/wnba/500/por.png",

    SEA:
      "https://a.espncdn.com/i/teamlogos/wnba/500/sea.png",

    TOR:
      "https://a.espncdn.com/i/teamlogos/wnba/500/tor.png",

    WSH:
      "https://a.espncdn.com/i/teamlogos/wnba/500/was.png"

  };


  async function loadJSON(
    path,
    fallback
  ) {

    try {

      const response =
        await fetch(
          path +
          "?t=" +
          Date.now(),
          {
            cache:
              "no-store"
          }
        );


      if (
        !response.ok
      ) {
        return fallback;
      }


      return await response.json();

    } catch (
      error
    ) {

      console.error(
        "Failed loading",
        path,
        error
      );

      return fallback;
    }

  }


  function exists(
    value
  ) {

    return (
      value !== null &&
      value !== undefined &&
      value !== "" &&
      !Number.isNaN(
        Number(
          value
        )
      )
    );

  }


  function num(
    value
  ) {

    if (
      !exists(
        value
      )
    ) {
      return "—";
    }


    return Number(
      value
    ).toFixed(
      1
    );

  }


  function probability(
    value
  ) {

    if (
      !exists(
        value
      )
    ) {
      return "—";
    }


    return (
      Number(
        value
      ) *
      100
    ).toFixed(
      1
    ) + "%";

  }


  function teamAbbr(
    game,
    side
  ) {

    return (
      game[
        side +
        "_abbr"
      ] ||
      side.toUpperCase()
    );

  }


  function teamName(
    game,
    side
  ) {

    return (
      game[
        side +
        "_team"
      ] ||
      teamAbbr(
        game,
        side
      )
    );

  }


  function teamLogo(
    abbr
  ) {

    const url =
      TEAM_LOGOS[
        String(
          abbr
        ).toUpperCase()
      ];


    if (
      !url
    ) {

      return `

        <span
          class="team-fallback"
        >
          ${abbr}
        </span>

      `;
    }


    return `

      <img
        class="team-logo"

        src="${url}"

        alt="${abbr} logo"

        loading="lazy"

        onerror="
          this.style.display='none';
        "
      >

    `;

  }


  function currentStatus(
    game
  ) {

    return (
      game.live_status ||
      game.status ||
      "STATUS_SCHEDULED"
    );

  }


  function isLive(
    game
  ) {

    const status =
      String(
        currentStatus(
          game
        )
      ).toUpperCase();


    return (
      status.includes(
        "IN_PROGRESS"
      ) ||
      status.includes(
        "HALFTIME"
      )
    );

  }


  function isFinal(
    game
  ) {

    return String(
      currentStatus(
        game
      )
    )
    .toUpperCase()
    .includes(
      "FINAL"
    );

  }


  function cleanStatus(
    game
  ) {

    const status =
      currentStatus(
        game
      );


    const map = {

      STATUS_SCHEDULED:
        "Scheduled",

      STATUS_IN_PROGRESS:
        "Live",

      STATUS_HALFTIME:
        "Halftime",

      STATUS_FINAL:
        "Final",

      STATUS_FINAL_OT:
        "Final / OT",

      STATUS_POSTPONED:
        "Postponed"

    };


    return (
      map[
        status
      ] ||
      String(
        status
      )
      .replace(
        "STATUS_",
        ""
      )
      .replaceAll(
        "_",
        " "
      )
    );

  }


  function statusClass(
    game
  ) {

    if (
      isLive(
        game
      )
    ) {
      return "status live";
    }


    if (
      isFinal(
        game
      )
    ) {
      return "status final";
    }


    return "status";

  }


  function periodLabel(
    game
  ) {

    const status =
      String(
        currentStatus(
          game
        )
      );


    if (
      status.includes(
        "HALFTIME"
      )
    ) {
      return "HALFTIME";
    }


    const period =
      Number(
        game.live_period
      );


    if (
      !Number.isFinite(
        period
      ) ||
      period <= 0
    ) {
      return "";
    }


    if (
      period <= 4
    ) {
      return (
        "Q" +
        period
      );
    }


    return (
      "OT" +
      (
        period -
        4
      )
    );

  }


  function liveClockText(
    game
  ) {

    if (
      !isLive(
        game
      )
    ) {
      return "";
    }


    const period =
      periodLabel(
        game
      );


    let clock =
      game.live_clock;


    if (
      clock === null ||
      clock === undefined ||
      clock === "" ||
      clock === 0 ||
      clock === 0.0 ||
      clock === "0.0"
    ) {
      clock = "";
    }


    if (
      period &&
      clock
    ) {
      return (
        period +
        " • " +
        clock
      );
    }


    return (
      period ||
      clock ||
      "Live"
    );

  }


  function modelSpread(
    game
  ) {

    if (
      !exists(
        game.predicted_margin
      )
    ) {
      return "—";
    }


    const margin =
      Number(
        game.predicted_margin
      );


    if (
      Math.abs(
        margin
      ) <
      0.05
    ) {
      return "PK";
    }


    if (
      margin >
      0
    ) {

      return (
        teamAbbr(
          game,
          "home"
        ) +
        " -" +
        Math.abs(
          margin
        ).toFixed(
          1
        )
      );

    }


    return (
      teamAbbr(
        game,
        "away"
      ) +
      " -" +
      Math.abs(
        margin
      ).toFixed(
        1
      )
    );

  }


  function projectedWinner(
    game
  ) {

    if (
      !exists(
        game.home_win_probability
      )
    ) {
      return "—";
    }


    return (
      Number(
        game.home_win_probability
      ) >=
      0.5
    )
      ? teamAbbr(
          game,
          "home"
        )
      : teamAbbr(
          game,
          "away"
        );

  }


  function favoriteProbability(
    game
  ) {

    if (
      !exists(
        game.home_win_probability
      ) ||
      !exists(
        game.away_win_probability
      )
    ) {
      return "—";
    }


    return probability(
      Math.max(
        Number(
          game.home_win_probability
        ),
        Number(
          game.away_win_probability
        )
      )
    );

  }


  function signedOdds(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "—";
    }


    const numberValue =
      Number(
        value
      );


    if (
      Number.isNaN(
        numberValue
      )
    ) {
      return String(
        value
      );
    }


    return (
      numberValue >
      0
        ? "+"
        : ""
    ) +
    numberValue.toFixed(
      0
    );

  }


  function marketAvailable(
    game
  ) {

    return (
      exists(
        game.market_home_spread
      ) ||
      exists(
        game.market_total
      ) ||
      exists(
        game.market_home_moneyline
      ) ||
      exists(
        game.market_away_moneyline
      )
    );

  }


  function marketSpread(
    game
  ) {

    if (
      !exists(
        game.market_home_spread
      )
    ) {
      return "—";
    }


    const spread =
      Number(
        game.market_home_spread
      );


    if (
      spread <
      0
    ) {

      return (
        teamAbbr(
          game,
          "home"
        ) +
        " " +
        spread.toFixed(
          1
        )
      );

    }


    if (
      spread >
      0
    ) {

      return (
        teamAbbr(
          game,
          "away"
        ) +
        " -" +
        Math.abs(
          spread
        ).toFixed(
          1
        )
      );

    }


    return "PK";

  }


  function spreadEdge(
    game
  ) {

    if (
      !exists(
        game.predicted_margin
      ) ||
      !exists(
        game.market_home_spread
      )
    ) {
      return null;
    }


    const modelHomeMargin =
      Number(
        game.predicted_margin
      );


    const marketHomeMargin =
      -Number(
        game.market_home_spread
      );


    return (
      modelHomeMargin -
      marketHomeMargin
    );

  }


  function totalEdge(
    game
  ) {

    if (
      !exists(
        game.predicted_total
      ) ||
      !exists(
        game.market_total
      )
    ) {
      return null;
    }


    return (
      Number(
        game.predicted_total
      ) -
      Number(
        game.market_total
      )
    );

  }


  function edgeClass(
    value
  ) {

    if (
      value === null ||
      Math.abs(
        value
      ) <
      0.5
    ) {
      return "edge-neutral";
    }


    return (
      value >
      0
        ? "edge-positive"
        : "edge-negative"
    );

  }


  function spreadEdgeText(
    game
  ) {

    const value =
      spreadEdge(
        game
      );


    if (
      value === null
    ) {
      return "—";
    }


    const home =
      teamAbbr(
        game,
        "home"
      );


    const away =
      teamAbbr(
        game,
        "away"
      );


    if (
      value >
      0
    ) {

      return (
        home +
        " +" +
        Math.abs(
          value
        ).toFixed(
          1
        ) +
        " pts"
      );

    }


    return (
      away +
      " +" +
      Math.abs(
        value
      ).toFixed(
        1
      ) +
      " pts"
    );

  }


  function totalEdgeText(
    game
  ) {

    const value =
      totalEdge(
        game
      );


    if (
      value === null
    ) {
      return "—";
    }


    if (
      value >
      0
    ) {

      return (
        "OVER +" +
        Math.abs(
          value
        ).toFixed(
          1
        )
      );

    }


    return (
      "UNDER +" +
      Math.abs(
        value
      ).toFixed(
        1
      )
    );

  }


  function projectionRow(
    label,
    away,
    home,
    margin,
    total
  ) {

    return `

      <tr>

        <td>
          ${label}
        </td>

        <td>
          ${num(
            away
          )}
        </td>

        <td>
          ${num(
            home
          )}
        </td>

        <td>
          ${num(
            margin
          )}
        </td>

        <td>
          ${num(
            total
          )}
        </td>

      </tr>

    `;

  }


  function livePanel(
    game
  ) {

    if (
      !isLive(
        game
      ) &&
      !isFinal(
        game
      )
    ) {
      return "";
    }


    const away =
      teamAbbr(
        game,
        "away"
      );


    const home =
      teamAbbr(
        game,
        "home"
      );


    const clock =
      liveClockText(
        game
      );


    return `

      <div class="live-score-panel">

        <div class="live-score-header">

          <div class="live-label">

            ${
              isFinal(
                game
              )
                ? "Final Score"
                : "Live Score"
            }

          </div>


          <div class="live-clock">

            ${
              isFinal(
                game
              )
                ? cleanStatus(
                    game
                  )
                : clock
            }

          </div>

        </div>


        <div class="live-score-grid">


          <div class="live-team">

            <div class="live-team-abbr">
              ${away}
            </div>

            <div class="live-team-score">

              ${num(
                game.live_away_score
              )}

            </div>

          </div>


          <div class="live-score-divider">
            –
          </div>


          <div class="live-team">

            <div class="live-team-abbr">
              ${home}
            </div>

            <div class="live-team-score">

              ${num(
                game.live_home_score
              )}

            </div>

          </div>


        </div>

      </div>

    `;

  }


  function modelMarketHTML(
    game
  ) {

    if (
      !marketAvailable(
        game
      )
    ) {

      return `

        <div class="market-section">


          <div class="market-panel">

            <div class="market-panel-title">
              Model
            </div>


            <div class="market-line">

              <span class="market-label">
                Spread
              </span>

              <span class="market-value">

                ${modelSpread(
                  game
                )}

              </span>

            </div>


            <div class="market-line">

              <span class="market-label">
                Total
              </span>

              <span class="market-value">

                ${num(
                  game.predicted_total
                )}

              </span>

            </div>

          </div>


          <div class="market-panel">

            <div class="market-panel-title">
              Market Odds
            </div>

            <div class="market-placeholder">

              Current market data
              is not available.

            </div>

          </div>


        </div>

      `;

    }


    const spreadValue =
      spreadEdge(
        game
      );


    const totalValue =
      totalEdge(
        game
      );


    return `

      <div class="market-section">


        <div class="market-panel">

          <div class="market-panel-title">
            Model
          </div>


          <div class="market-line">

            <span class="market-label">
              Spread
            </span>

            <span class="market-value">

              ${modelSpread(
                game
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">
              Total
            </span>

            <span class="market-value">

              ${num(
                game.predicted_total
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">
              Win probability
            </span>

            <span class="market-value">

              ${projectedWinner(
                game
              )}

              ${favoriteProbability(
                game
              )}

            </span>

          </div>

        </div>


        <div class="market-panel">

          <div class="market-panel-title">

            ${
              game.market_bookmaker ||
              "DraftKings"
            }

          </div>


          <div class="market-line">

            <span class="market-label">
              Spread
            </span>

            <span class="market-value">

              ${marketSpread(
                game
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">
              Total
            </span>

            <span class="market-value">

              ${num(
                game.market_total
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">

              ${
                teamAbbr(
                  game,
                  "away"
                )
              } ML

            </span>

            <span class="market-value">

              ${signedOdds(
                game.market_away_moneyline
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">

              ${
                teamAbbr(
                  game,
                  "home"
                )
              } ML

            </span>

            <span class="market-value">

              ${signedOdds(
                game.market_home_moneyline
              )}

            </span>

          </div>

        </div>


        <div class="market-panel">

          <div class="market-panel-title">
            Model Edge
          </div>


          <div class="market-line">

            <span class="market-label">
              Spread
            </span>

            <span
              class="
                market-value
                ${edgeClass(
                  spreadValue
                )}
              "
            >

              ${spreadEdgeText(
                game
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">
              Total
            </span>

            <span
              class="
                market-value
                ${edgeClass(
                  totalValue
                )}
              "
            >

              ${totalEdgeText(
                game
              )}

            </span>

          </div>


          <div class="market-line">

            <span class="market-label">
              Market updated
            </span>

            <span class="market-value">

              ${
                game.market_updated_at
                  ? new Date(
                      game.market_updated_at
                    ).toLocaleTimeString(
                      [],
                      {
                        hour:
                          "numeric",

                        minute:
                          "2-digit"
                      }
                    )
                  : "—"
              }

            </span>

          </div>

        </div>


      </div>

    `;

  }


  function gameCard(
    game
  ) {

    const away =
      teamAbbr(
        game,
        "away"
      );


    const home =
      teamAbbr(
        game,
        "home"
      );


    const liveClass =
      isLive(
        game
      )
        ? "game-card live-game"
        : "game-card";


    return `

      <section
        class="${liveClass}"
      >


        <div class="game-header">


          <div
            class="${statusClass(
              game
            )}"
          >

            ${cleanStatus(
              game
            )}

          </div>


          <div class="matchup-row">


            <div>


              <div class="matchup-teams">


                <div class="team-block">

                  ${teamLogo(
                    away
                  )}

                  <span class="matchup-name">

                    ${teamName(
                      game,
                      "away"
                    )}

                  </span>

                </div>


                <span class="at-symbol">
                  @
                </span>


                <div class="team-block">

                  ${teamLogo(
                    home
                  )}

                  <span class="matchup-name">

                    ${teamName(
                      game,
                      "home"
                    )}

                  </span>

                </div>


              </div>


              <div class="venue">

                ${
                  game.status_detail ||
                  ""
                }

                ${
                  game.venue
                    ? " · " +
                      game.venue
                    : ""
                }

              </div>


            </div>


          </div>


        </div>


        <div class="game-body">


          ${livePanel(
            game
          )}


          <div class="pregame-heading">

            Pregame Model

          </div>


          <div class="headline-grid">


            <div class="metric">

              <div class="metric-label">
                Projected Final
              </div>


              <div class="score-grid">


                <div class="score-side">

                  <div class="score-abbr">
                    ${away}
                  </div>

                  <div class="score-number">

                    ${num(
                      game.away_score
                    )}

                  </div>

                </div>


                <div class="score-separator">
                  –
                </div>


                <div class="score-side">

                  <div class="score-abbr">
                    ${home}
                  </div>

                  <div class="score-number">

                    ${num(
                      game.home_score
                    )}

                  </div>

                </div>


              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                Model Spread
              </div>

              <div class="metric-value">

                ${modelSpread(
                  game
                )}

              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                Projected Winner
              </div>

              <div class="metric-value pick">

                ${projectedWinner(
                  game
                )}

              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                Win Probability
              </div>

              <div class="metric-value">

                ${favoriteProbability(
                  game
                )}

              </div>

            </div>


          </div>


          <div class="headline-grid">


            <div class="metric">

              <div class="metric-label">
                Predicted Total
              </div>

              <div class="metric-value">

                ${num(
                  game.predicted_total
                )}

              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                ${away} Win
              </div>

              <div class="metric-value">

                ${probability(
                  game.away_win_probability
                )}

              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                ${home} Win
              </div>

              <div class="metric-value">

                ${probability(
                  game.home_win_probability
                )}

              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                Model Margin
              </div>

              <div class="metric-value">

                ${num(
                  Math.abs(
                    Number(
                      game.predicted_margin
                    )
                  )
                )}

              </div>

            </div>


          </div>


          <h3 class="section-title">
            Model vs Market
          </h3>


          ${modelMarketHTML(
            game
          )}


          <h3 class="section-title">
            Period Projections
          </h3>


          <div class="projection-table-wrap">


            <table class="projection-table">


              <thead>


                <tr>

                  <th>
                    Period
                  </th>

                  <th>
                    ${away}
                  </th>

                  <th>
                    ${home}
                  </th>

                  <th>
                    Home Margin
                  </th>

                  <th>
                    Total
                  </th>

                </tr>


              </thead>


              <tbody>


                ${projectionRow(
                  "Q1",
                  game.away_q1,
                  game.home_q1,
                  game.q1_margin,
                  game.q1_total
                )}


                ${projectionRow(
                  "Q2",
                  game.away_q2,
                  game.home_q2,
                  game.q2_margin,
                  game.q2_total
                )}


                ${projectionRow(
                  "1st Half",
                  game.away_first_half,
                  game.home_first_half,
                  game.first_half_margin,
                  game.first_half_total
                )}


                ${projectionRow(
                  "Q3",
                  game.away_q3,
                  game.home_q3,
                  game.q3_margin,
                  game.q3_total
                )}


                ${projectionRow(
                  "Q4",
                  game.away_q4,
                  game.home_q4,
                  game.q4_margin,
                  game.q4_total
                )}


                ${projectionRow(
                  "2nd Half",
                  game.away_second_half,
                  game.home_second_half,
                  game.second_half_margin,
                  game.second_half_total
                )}


              </tbody>


            </table>


          </div>


        </div>


      </section>

    `;

  }


  function historyHTML(
    historyPayload
  ) {

    const history =
      Array.isArray(
        historyPayload
      )
        ? historyPayload

        : Array.isArray(
            historyPayload.events
          )
          ? historyPayload.events

          : [];


    if (
      !history.length
    ) {

      return `

        <div class="muted">
          No prediction history yet.
        </div>

      `;

    }


    return `

      <div class="history-table-wrap">


        <table class="history-table">


          <thead>

            <tr>

              <th>
                Game
              </th>

              <th>
                Prediction Time
              </th>

              <th>
                Projected Final
              </th>

              <th>
                Spread
              </th>

              <th>
                Total
              </th>

              <th>
                Home Win
              </th>

            </tr>

          </thead>


          <tbody>


            ${history
              .slice(
                0,
                25
              )
              .map(
                row => `

                  <tr>

                    <td>

                      ${
                        row.away_abbr ||
                        row.away_team ||
                        "Away"
                      }

                      @

                      ${
                        row.home_abbr ||
                        row.home_team ||
                        "Home"
                      }

                    </td>


                    <td>

                      ${
                        row.prediction_date
                          ? new Date(
                              row.prediction_date
                            ).toLocaleString()
                          : "—"
                      }

                    </td>


                    <td>

                      ${num(
                        row.away_score
                      )}

                      –

                      ${num(
                        row.home_score
                      )}

                    </td>


                    <td>

                      ${
                        exists(
                          row.predicted_margin
                        )
                          ? (
                              Number(
                                row.predicted_margin
                              ) >=
                              0
                                ? (
                                    (
                                      row.home_abbr ||
                                      "HOME"
                                    ) +
                                    " -" +
                                    Math.abs(
                                      Number(
                                        row.predicted_margin
                                      )
                                    ).toFixed(
                                      1
                                    )
                                  )
                                : (
                                    (
                                      row.away_abbr ||
                                      "AWAY"
                                    ) +
                                    " -" +
                                    Math.abs(
                                      Number(
                                        row.predicted_margin
                                      )
                                    ).toFixed(
                                      1
                                    )
                                  )
                            )
                          : "—"
                      }

                    </td>


                    <td>

                      ${num(
                        row.predicted_total ??
                        row.full_total
                      )}

                    </td>


                    <td>

                      ${probability(
                        row.home_win_probability ??
                        row.home_win
                      )}

                    </td>


                  </tr>

                `
              )
              .join("")}


          </tbody>


        </table>


      </div>

    `;

  }


  async function render() {


    const latest =
      await loadJSON(
        "latest.json",
        {}
      );


    const historyPayload =
      await loadJSON(
        "history.json",
        {
          events: []
        }
      );


    const status =
      document.getElementById(
        "status"
      );


    const gamesContainer =
      document.getElementById(
        "games"
      );


    const historyContainer =
      document.getElementById(
        "history"
      );


    const games =
      Array.isArray(
        latest
      )
        ? latest

        : Array.isArray(
            latest.games
          )
          ? latest.games

          : [];


    if (
      !games.length
    ) {


      status.innerHTML = `

        <strong>
          Dashboard online
        </strong>

        <div class="muted">
          No predictions are currently available.
        </div>

      `;


      gamesContainer.innerHTML =
        "";


    } else {


      const liveGames =
        games.filter(
          game =>
            isLive(
              game
            )
        ).length;


      const generated =
        latest.last_live_update_utc ||
        latest.generated_at_utc;


      status.innerHTML = `

        <strong>

          ${
            liveGames >
            0
              ? `${liveGames} live game${liveGames === 1 ? "" : "s"}`
              : "Today's WNBA Predictions"
          }

        </strong>


        <div class="muted">

          ${games.length}

          game${
            games.length ===
            1
              ? ""
              : "s"
          }

          available

          ${
            generated
              ? " · Updated " +
                new Date(
                  generated
                ).toLocaleString()
              : ""
          }

        </div>

      `;


      gamesContainer.innerHTML =
        games
          .map(
            gameCard
          )
          .join("");

    }


    historyContainer.innerHTML =
      historyHTML(
        historyPayload
      );

  }


  render();


  /*
   * Reload live JSON every 30 seconds.
   *
   * GitHub Pages itself will only change when Actions publishes a
   * new docs/latest.json, but the phone/browser will see the update
   * automatically once the new file is deployed.
   */
  setInterval(
    render,
    30000
  );


</script>


</body>

</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WNBA Prediction Dashboard</title>
<style>
:root{--bg:#080b10;--panel:#121821;--panel2:#0d131b;--border:#27303d;--text:#f5f7fb;--muted:#98a3b3;--accent:#84a9ff;--accent2:#6ee7b7;--live:#ff6b72;--good:#68d99d;--warn:#f3cc6c;--bad:#ff8b91}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070a0f,#0a0e14 35%,#070a0f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(8,11,16,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.head{max-width:1180px;margin:auto;padding:12px 14px 9px}.title{font-size:1.2rem;font-weight:900}.sub{font-size:.72rem;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:4px;max-width:1180px;margin:auto;padding:0 10px;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);font-weight:800;padding:9px 10px;border-bottom:2px solid transparent}.tab.active{color:var(--text);border-color:var(--accent)}main{max-width:1180px;margin:auto;padding:10px 10px 34px}.panel{display:none}.panel.active{display:block}.statusbar,.card,.section{background:rgba(18,24,33,.96);border:1px solid var(--border);border-radius:14px}.statusbar{padding:9px 11px;margin-bottom:10px;font-size:.76rem}.card{overflow:hidden;margin-bottom:12px}.card.live{border-color:rgba(255,107,114,.55);box-shadow:0 0 0 1px rgba(255,107,114,.08),0 18px 45px rgba(0,0,0,.18)}.gamehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--border)}.match{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:1.06rem;font-weight:900}.logo{width:27px;height:27px;object-fit:contain}.at{color:var(--muted)}.meta{font-size:.7rem;color:var(--muted);margin-top:4px}.badge{border-radius:999px;padding:5px 9px;font-size:.65rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:#26303d}.badge.live{color:#ff9499;background:rgba(255,107,114,.13);border:1px solid rgba(255,107,114,.45)}.badge.final{color:var(--good);background:rgba(104,217,157,.12);border:1px solid rgba(104,217,157,.38)}.body{padding:11px}.scorebar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,107,114,.09);border:1px solid rgba(255,107,114,.35);margin-bottom:10px}.scorebar .label{color:#ff959a;font-weight:900;font-size:.7rem}.score{font-size:1.45rem;font-weight:950;text-align:center}.clock{font-size:.72rem;color:var(--muted);font-weight:800;text-align:right}.livehero{position:relative;overflow:hidden;border-radius:15px;padding:12px;border:1px solid rgba(132,169,255,.45);background:radial-gradient(circle at 0% 0%,rgba(132,169,255,.20),transparent 40%),radial-gradient(circle at 100% 100%,rgba(110,231,183,.12),transparent 42%),#111925;margin-bottom:12px}.livehero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 10%,rgba(255,255,255,.025),transparent 70%);pointer-events:none}.livetitle{position:relative;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}.livetitle strong{color:#b5c9ff;letter-spacing:.08em;font-size:.72rem}.fresh{font-size:.64rem;color:var(--muted);font-weight:700}.fresh.stale{color:var(--warn)}.proj{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px;border-radius:12px;border:1px solid rgba(132,169,255,.22);background:rgba(6,10,16,.46);margin-bottom:8px}.projteam{text-align:center}.abbr{font-size:.62rem;color:var(--muted);font-weight:900;letter-spacing:.05em}.projnum{font-size:1.75rem;font-weight:950;line-height:1.05;margin-top:3px}.dash{font-size:1.35rem;color:#ccd6e4}.livegrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.livecell{min-width:0;padding:10px;border:1px solid rgba(132,169,255,.18);border-radius:11px;background:rgba(7,11,17,.52)}.livecell .k{font-size:.62rem;color:var(--muted);margin-bottom:4px}.livecell .v{font-size:1.05rem;font-weight:950}.winbar{height:5px;border-radius:99px;background:#252f3d;margin-top:7px;overflow:hidden}.winfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.delta{font-size:.58rem;color:var(--muted);margin-top:4px}.sectiontitle{display:flex;align-items:center;gap:8px;margin:12px 0 7px;font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#dce3ed}.sectiontitle:after{content:"";height:1px;background:var(--border);flex:1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric{padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--panel2)}.metric .k{font-size:.6rem;color:var(--muted);margin-bottom:3px}.metric .v{font-size:.9rem;font-weight:900}.section{padding:11px;margin-bottom:10px}.section h2{font-size:1rem;margin:0 0 8px}.row{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:6px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.72rem}.row:last-child{border-bottom:0}.row b{font-weight:900}.muted{color:var(--muted)}.empty{padding:14px;color:var(--muted)}
@media(max-width:650px){main{padding:8px 7px 30px}.head{padding:10px 10px 7px}.gamehead{padding:10px}.body{padding:9px}.match{font-size:.98rem}.scorebar{grid-template-columns:auto 1fr;gap:6px}.clock{grid-column:1/-1;text-align:center;margin-top:-2px}.score{font-size:1.35rem}.livehero{padding:10px}.livetitle{align-items:flex-start}.livetitle span{max-width:48%;text-align:right}.proj{padding:11px}.projnum{font-size:2rem}.livegrid{grid-template-columns:1fr 1fr}.livecell:first-child{grid-column:1/-1}.livecell:first-child .v{font-size:1.18rem}.metrics{grid-template-columns:1fr 1fr}.row{grid-template-columns:1.3fr 1fr 1fr}.row>*:nth-child(n+4){display:none}}
</style>
</head>
<body>
<header><div class="head"><div class="title">WNBA Prediction Dashboard</div><div class="sub">Pregame projections, live score tracking, and continuously updated in-game model</div></div><nav class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="performance">Performance</button><button class="tab" data-tab="history">History</button></nav></header>
<main>
<section id="today" class="panel active"><div id="status" class="statusbar">Loading…</div><div id="games"></div></section>
<section id="performance" class="panel"><div class="section"><h2>Model Performance</h2><div id="perf"></div></div></section>
<section id="history" class="panel"><div class="section"><h2>Prediction History</h2><div id="hist"></div></div></section>
</main>
<script>
const logos={ATL:'atl',CHI:'chi',CON:'conn',DAL:'dal',GS:'gs',IND:'ind',LA:'la',LV:'lv',MIN:'min',NY:'ny',PHX:'phx',POR:'por',SEA:'sea',TOR:'tor',WSH:'was'};
const E=v=>v!==null&&v!==undefined&&v!==''&&!Number.isNaN(Number(v));
const N=(v,d=1)=>E(v)?Number(v).toFixed(d):'—';
const I=v=>E(v)?String(Math.round(Number(v))):'—';
const P=v=>E(v)?(Number(v)*100).toFixed(1)+'%':'—';
const status=g=>String(g.live_status||g.status||'STATUS_SCHEDULED');
const live=g=>status(g).includes('IN_PROGRESS')||status(g).includes('HALFTIME');
const final=g=>status(g).includes('FINAL');
const ab=(g,s)=>g[s+'_abbr']||s.toUpperCase();
const name=(g,s)=>g[s+'_team']||ab(g,s);
const logo=a=>logos[a]?`<img class="logo" src="https://a.espncdn.com/i/teamlogos/wnba/500/${logos[a]}.png" alt="">`:'';
function ago(v){if(!v)return'unknown';const s=Math.max(0,Math.floor((Date.now()-new Date(v))/1000));if(s<60)return s+'s ago';return Math.floor(s/60)+'m '+(s%60)+'s ago'}
function stale(v){return !v||Date.now()-new Date(v).getTime()>90000}
function period(g){if(status(g).includes('HALFTIME'))return'Halftime';const p=Number(g.live_period);if(!p)return'';return p<=4?'Q'+p:'OT'+(p-4)}
function spread(g,key='predicted_margin'){if(!E(g[key]))return'—';const m=Number(g[key]);if(Math.abs(m)<.5)return'PK';return m>0?ab(g,'home')+' -'+Math.abs(m).toFixed(1):ab(g,'away')+' -'+Math.abs(m).toFixed(1)}
function winner(g,key='home_win_probability'){if(!E(g[key]))return'—';return Number(g[key])>=.5?ab(g,'home'):ab(g,'away')}
function favoriteProb(g,h='home_win_probability',a='away_win_probability'){if(!E(g[h])||!E(g[a]))return'—';return P(Math.max(Number(g[h]),Number(g[a])))}
function delta(v,base,suffix=''){if(!E(v)||!E(base))return'';const d=Number(v)-Number(base);return `${d>=0?'+':''}${d.toFixed(1)}${suffix} vs pregame`}
function gameCard(g){const A=ab(g,'away'),H=ab(g,'home'),u=g.live_projection_updated_at||g.live_updated_at;const lp=live(g);const f=final(g);const wp=E(g.live_home_win_probability)?Number(g.live_home_win_probability):null;const fav=winner(g,'live_home_win_probability');const favp=favoriteProb(g,'live_home_win_probability','live_away_win_probability');const winPct=wp===null?0:(fav===H?wp:1-wp)*100;return `<article class="card ${lp?'live':''}"><div class="gamehead"><div><div class="match"><span>${logo(A)}${name(g,'away')}</span><span class="at">@</span><span>${logo(H)}${name(g,'home')}</span></div><div class="meta">${g.live_status_detail||g.status_detail||''}${g.venue?' · '+g.venue:''}</div></div><div class="badge ${lp?'live':f?'final':''}">${lp?'LIVE':f?'FINAL':'SCHEDULED'}</div></div><div class="body">${lp||f?`<div class="scorebar"><div class="label">${f?'FINAL':'LIVE'}</div><div class="score">${A} ${I(g.live_away_score)} – ${H} ${I(g.live_home_score)}</div><div class="clock">${f?'Final':period(g)+(g.live_clock&&g.live_clock!=='0.0'?' · '+g.live_clock:'')}</div></div>`:''}${lp&&E(g.live_projected_home_score)?`<div class="livehero"><div class="livetitle"><strong>UPDATED LIVE PROJECTION</strong><span class="fresh ${stale(u)?'stale':''}">${stale(u)?'⚠ ':''}Updated ${ago(u)}</span></div><div class="proj"><div class="projteam"><div class="abbr">${A}</div><div class="projnum">${N(g.live_projected_away_score)}</div></div><div class="dash">–</div><div class="projteam"><div class="abbr">${H}</div><div class="projnum">${N(g.live_projected_home_score)}</div></div></div><div class="livegrid"><div class="livecell"><div class="k">Live Win</div><div class="v">${fav} ${favp}</div><div class="winbar"><div class="winfill" style="width:${Math.max(0,Math.min(100,winPct))}%"></div></div><div class="delta">Based on ${A} ${I(g.live_away_score)}–${H} ${I(g.live_home_score)}, ${period(g)} ${g.live_clock||''}</div></div><div class="livecell"><div class="k">Live Spread</div><div class="v">${spread(g,'live_predicted_margin')}</div><div class="delta">${delta(Math.abs(Number(g.live_predicted_margin||0)),Math.abs(Number(g.predicted_margin||0)))}</div></div><div class="livecell"><div class="k">Live Total</div><div class="v">${N(g.live_predicted_total)}</div><div class="delta">${delta(g.live_predicted_total,g.predicted_total)}</div></div></div></div>`:''}<div class="sectiontitle">Pregame Model</div><div class="metrics"><div class="metric"><div class="k">Projected Final</div><div class="v">${A} ${N(g.away_score)} – ${H} ${N(g.home_score)}</div></div><div class="metric"><div class="k">Spread</div><div class="v">${spread(g)}</div></div><div class="metric"><div class="k">Win Pick</div><div class="v">${winner(g)} ${favoriteProb(g)}</div></div><div class="metric"><div class="k">Total</div><div class="v">${N(g.predicted_total)}</div></div></div></div></article>`}
async function j(path,fallback){try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():fallback}catch(e){return fallback}}
async function render(){const [l,p,h]=await Promise.all([j('latest.json',{}),j('performance.json',{summary:{},games:[]}),j('history.json',{events:[]})]);const gs=Array.isArray(l)?l:(l.games||[]);const active=gs.filter(live);const u=l.last_live_update_utc||l.live_generated_at_utc||l.generated_at_utc;document.getElementById('status').innerHTML=`<b>${active.length?active.length+' live game'+(active.length>1?'s':''):"Today's Predictions"}</b><span class="muted"> · ${gs.length} games${u?' · data updated '+ago(u):''}${active.length&&stale(u)?' · ⚠ feed is stale':''}</span>`;document.getElementById('games').innerHTML=gs.length?gs.map(gameCard).join(''):'<div class="empty">No games available.</div>';const s=p.summary||{};document.getElementById('perf').innerHTML=`<div class="metrics"><div class="metric"><div class="k">Games</div><div class="v">${E(s.games_evaluated)?I(s.games_evaluated):'—'}</div></div><div class="metric"><div class="k">Winner Accuracy</div><div class="v">${P(s.winner_accuracy)}</div></div><div class="metric"><div class="k">Margin MAE</div><div class="v">${N(s.margin_mae)}</div></div><div class="metric"><div class="k">Total MAE</div><div class="v">${N(s.total_mae)}</div></div></div>`;const rows=Array.isArray(h)?h:(h.events||[]);document.getElementById('hist').innerHTML=rows.slice(0,30).map(r=>`<div class="row"><b>${r.away_abbr||'AWAY'} @ ${r.home_abbr||'HOME'}</b><span>${spread(r)}</span><span>${N(r.predicted_total)}</span><span>${r.prediction_date?new Date(r.prediction_date).toLocaleString():'—'}</span><span>${r.market_bookmaker||''}</span></div>`).join('')||'<div class="empty">No history yet.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
render();setInterval(render,15000);
</script>
</body>
</html>
